<section class="events section" id="events" aria-labelledby="events-title">
  <div class="container">
    <header class="events__head">
      <p class="events__note font-hand">save the date ✍</p>
      <h2 id="events-title">Tasting Club</h2>
    </header>

    <ul class="events__grid">
      @for (event of events; track event.id) {
        <li>
          <article class="event-card">
            <app-badge variant="stamp" tone="ruby">[{{ event.when }}]</app-badge>
            <h3 class="event-card__title">{{ event.title }}</h3>
            <p class="event-card__desc">{{ event.description }}</p>
            <p class="event-card__meta">
              <span>{{ event.time }}</span>
              <span class="price">{{ event.price }}</span>
            </p>
          </article>
        </li>
      }
    </ul>
  </div>
</section>
