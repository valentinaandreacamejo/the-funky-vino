<section class="contact section" id="book" aria-labelledby="contact-title">
  <div class="container">
    <div class="contact__card">
      <div class="contact__copy">
        <p class="contact__kicker font-hand">psst… Friday tables go fast</p>
        <h2 id="contact-title" class="contact__title">Ready to get funky?</h2>
        <p class="contact__text">
          Book a table for two or for the whole crew. Walk-ins are always welcome at the bar.
        </p>
        <ul class="contact__links">
          <li><a [href]="'tel:' + phone.replaceAll(' ', '')">{{ phone }}</a></li>
          <li><a [href]="'mailto:' + email">{{ email }}</a></li>
        </ul>
      </div>

      <a class="stamp-btn" [href]="'mailto:' + email + '?subject=Table%20booking'" aria-label="Book a table">
        <svg class="stamp-btn__ring" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <path id="stamp-btn-circle" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0" />
          </defs>
          <text>
            <textPath href="#stamp-btn-circle" textLength="488" lengthAdjust="spacing">
              BOOK A TABLE ✺ BOOK A TABLE ✺ BOOK A TABLE ✺
            </textPath>
          </text>
        </svg>
        <img class="stamp-btn__icon" src="assets/icons/calici-brindisi-doodle.svg" alt="" width="104" height="104" />
      </a>
    </div>
  </div>
</section>
