<section class="hero" id="top">
  <div class="hero__inner container">
    <div class="hero__copy">
      <p class="hero__kicker font-hand">ciao, wine lovers ✶ Milano</p>
      <h1 class="hero__title">
        Good wine, <span class="hero__highlight">funky vibes</span> &amp; small plates.
      </h1>
      <p class="hero__subtitle">
        A natural wine sanctuary for slow evenings, loud laughs, and unpretentious pours.
      </p>

      <div class="hero__footer">
        <div class="hero__actions">
          <a app-button size="lg" href="#book">Book a table</a>

      <figure class="hero__card">

          height="1024"
          fetchpriority="high"
        />
      </figure>
      <span class="hero__sticker" aria-hidden="true">
        <img src="assets/icons/calici-brindisi-doodle.svg" alt="" width="120" height="120" />
      </span>
    </div>
  </div>
