<div class="ticker__track" [style.--ticker-duration]="duration() + 's'">
  @for (copy of copies; track copy) {
    <ul class="ticker__group" [attr.aria-hidden]="copy > 0 ? 'true' : null">
      @for (item of items(); track $index) {
        <li class="ticker__item">{{ item }}</li>
      }
    </ul>
  }
</div>
