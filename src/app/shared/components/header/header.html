<div class="header container">
  <a class="logo" href="#top" aria-label="The Funky Vino — home">
    <img class="logo__icon" src="assets/icons/bottiglia-vino-doodle.svg" alt="" width="48" height="48" />
    <span class="logo__text">The Funky Vino</span>
  </a>

  <button
    class="burger"
    type="button"
    aria-controls="main-nav"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()"
  >
    <span class="visually-hidden">Menu</span>
    <span class="burger__line"></span>
    <span class="burger__line"></span>
    <span class="burger__line"></span>
  </button>

  <nav id="main-nav" class="nav" [class.nav--open]="menuOpen()" aria-label="Main navigation">
    <ul class="nav__list">
      @for (link of links; track link.href) {
        <li>
          <a class="nav__link" [href]="link.href" (click)="closeMenu()">
            <app-badge variant="tag" tone="rose">{{ link.index }}</app-badge>
            <span class="nav__label">{{ link.label }}</span>
          </a>
        </li>
      }
    </ul>
    <a app-button size="sm" class="nav__cta" href="#book" (click)="closeMenu()">Book a table</a>
  </nav>
</div>
